services:
  api:
    build:
      context: ../..
      dockerfile: docker/local/Dockerfile.local
    container_name: aero-api-local
    ports:
      - "8020:8000"
      - "5690:5680"
    volumes:
      - ../..:/app
    env_file:
      - ../../.env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aero-network

  postgres:
    image: postgres:16-alpine
    container_name: aero-postgres-local
    environment:
      - POSTGRES_USER=aero
      - POSTGRES_PASSWORD=aero
      - POSTGRES_DB=aero
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - aero_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aero -d aero"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - aero-network

volumes:
  aero_pgdata:

networks:
  aero-network:
    driver: bridge
