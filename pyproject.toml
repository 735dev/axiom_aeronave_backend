[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "axiom-aeronave-backend"
version = "0.1.0"
description = "Backend de Aeronaves (Axiom): cliente de integración con Blackbox"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.136.3",
  "starlette==1.10.0",
  "fastapi-basekit>=0.5.5",
  "fastapi-restful==0.6.0",
  "uvicorn[standard]>=0.34",
  "pydantic[email]>=2.11",
  "python-multipart>=0.0.33",
  "pydantic-settings>=2.8",
  "SQLAlchemy[asyncio]==2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "PyJWT>=2.10",
  "bcrypt>=5",
  "httpx>=0.27",
  "redis>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "black>=24"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 100
